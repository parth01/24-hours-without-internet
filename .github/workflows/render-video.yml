name: 🎬 Render 24 Hours Without Internet - Final Video

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: 📥 Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. NODE
      # ============================================================

      - name: 🟢 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22


      # ============================================================
      # 3. PNPM
      # ============================================================

      - name: 📦 Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10


      # ============================================================
      # 4. INSTALL PROJECT
      # ============================================================

      - name: 📦 Install dependencies
        run: |
          pnpm install --no-frozen-lockfile


      # ============================================================
      # 5. PLAYWRIGHT
      # ============================================================

      - name: 🎭 Install Playwright
        run: |
          pnpm add -Dw playwright@1.55.0
          pnpm exec playwright install --with-deps chromium


      # ============================================================
      # 6. FFMPEG
      # ============================================================

      - name: 🎞️ Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version


      # ============================================================
      # 7. PYTHON
      # ============================================================

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ============================================================
      # 8. PIPER
      # ============================================================

      - name: 🎙️ Install Piper TTS
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install piper-tts


      # ============================================================
      # 9. DIRECTORIES
      # ============================================================

      - name: 📁 Create directories
        run: |
          mkdir -p audio
          mkdir -p audio/voice
          mkdir -p audio/sfx
          mkdir -p render


      # ============================================================
      # 10. NARRATION SCRIPT
      # ============================================================

      - name: 📝 Create 5-minute narration
        run: |

          cat > audio/narration.txt <<'EOF'

          Imagine waking up tomorrow morning and discovering something impossible.

          The internet is gone.

          Not slow.

          Not experiencing a temporary outage.

          Completely gone.

          At first, you probably wouldn't even realize it.

          Your phone would still turn on.

          Your television would still work.

          The lights in your house would still be on.

          Your car would still start.

          Everything around you would look completely normal.

          But then you would try to open a website.

          Nothing.

          You would open social media.

          Nothing.

          You would try to send a message.

          Nothing.

          You would check your Wi-Fi.

          It might say that you're connected.

          But there would be nowhere to go.

          And then you would realize something much bigger was happening.

          This wasn't your router.

          It wasn't your phone.

          It wasn't your internet provider.

          The entire world had suddenly lost its connection.

          Within minutes, billions of people would begin doing exactly the same thing.

          They would restart their routers.

          Restart their phones.

          Check their cables.

          Call their internet providers.

          And then they would start calling other people.

          But those calls might not work either.

          The first major problem would be communication.

          Modern communication is deeply dependent on internet infrastructure.

          Messaging apps.

          Video calls.

          Social media.

          Email.

          Cloud services.

          Even many systems that appear completely separate from the internet depend on online communication somewhere behind the scenes.

          Suddenly, billions of people would be forced back into a world where information moves much more slowly.

          Then another problem would become obvious.

          Money.

          Today, we rarely think about how much of our financial life depends on connected computer systems.

          Credit cards.

          Debit cards.

          Mobile payments.

          Online banking.

          Digital wallets.

          Automated transactions.

          All of these systems depend on computers communicating with other computers.

          If that communication stopped, paying for things could become extremely difficult.

          Imagine walking into a grocery store.

          You fill your cart.

          You reach the checkout.

          And then your card doesn't work.

          The cashier tries again.

          Still nothing.

          Suddenly, the cash in your wallet becomes much more valuable.

          ATMs could also become unavailable.

          People would begin looking for physical cash.

          Stores would have to decide how to handle customers when their electronic payment systems no longer function.

          And this is where the internet outage would begin affecting the physical world.

          Because the internet isn't only about websites.

          It connects businesses, warehouses, transportation companies, manufacturers, banks, hospitals, and countless other systems.

          Modern supply chains depend on information moving constantly.

          A warehouse needs to know what inventory is available.

          A truck needs to know where it is going.

          A store needs to know what products are arriving.

          A manufacturer needs to know which parts are available.

          Remove the communication between those systems, and the physical movement of goods begins to slow down.

          At first, the shelves in stores might look completely normal.

          But as the hours passed, the difference would become noticeable.

          Deliveries would be delayed.

          Inventory systems might stop updating.

          Businesses would have difficulty coordinating shipments.

          And people would start buying whatever they believed they might need.

          Cities would feel different too.

          Navigation applications would stop receiving updates.

          Ride-sharing services would disappear.

          Food delivery applications would stop working.

          Many people who normally depend on digital maps would suddenly have to remember how to get somewhere.

          Traffic systems could also experience problems depending on how heavily they rely on network connectivity.

          But something surprising would happen at the same time.

          A lot of things would continue working.

          Electricity would not suddenly disappear simply because the public internet was gone.

          Water systems would continue operating.

          Cars could still drive.

          Many factories could continue operating with local systems.

          Hospitals would still have emergency procedures.

          And people would still be able to meet face to face.

          Humans lived for thousands of years without the internet.

          So within a few hours, people would begin rediscovering older solutions.

          Printed maps would suddenly become useful again.

          Radio would become important.

          Landline telephones would become more valuable.

          Businesses would start using paper records.

          People would begin writing things down.

          And perhaps most importantly, people would simply start talking to each other again.

          Neighborhoods might become surprisingly active.

          People would walk outside to find out what was happening.

          They would ask their neighbors.

          They would share information.

          Someone with a working radio might become the most informed person on the block.

          And while ordinary people adapted, companies would be facing a much bigger problem.

          Productivity would collapse in industries that depend heavily on cloud services.

          Employees who normally work remotely would lose access to their systems.

          Customer service operations could stop functioning.

          Online advertising would disappear.

          E-commerce would effectively freeze.

          Financial markets could face serious disruption.

          And companies that rely on real-time data would suddenly be operating with incomplete information.

          The economic consequences would grow with every hour.

          One hour might be inconvenient.

          Six hours would be disruptive.

          Twelve hours could become expensive.

          Twenty-four hours would become a major global event.

          But then comes the most interesting part.

          The internet comes back.

          Suddenly, phones begin receiving messages.

          Emails start arriving.

          Bank transactions begin processing.

          Websites load again.

          Social media comes back to life.

          Notifications that had been waiting for hours appear all at once.

          People would probably celebrate.

          But they would also discover something important.

          During those twenty-four hours, they had been reminded just how much modern life depends on an invisible network.

          We rarely think about the internet when it works.

          It is simply there.

          We use it to communicate.

          To work.

          To shop.

          To travel.

          To pay.

          To entertain ourselves.

          And to connect billions of devices around the planet.

          The internet has become more than a collection of websites.

          It has become part of the infrastructure of modern civilization.

          So would the world end if the internet disappeared for twenty-four hours?

          Probably not.

          Humans would adapt.

          Older systems would come back into use.

          People would find ways to communicate.

          Businesses would improvise.

          And eventually, the connection would return.

          But the experience would be a powerful reminder.

          The most important systems in our lives are often the ones we barely notice.

          We don't think about electricity until the power goes out.

          We don't think about water until the pipes stop working.

          And we don't think about the internet until the screen suddenly says:

          No connection.

          So the next time your Wi-Fi disappears for thirty seconds, remember.

          You aren't just losing a connection.

          You're getting a tiny glimpse of what the world might feel like if the invisible network connecting modern society suddenly disappeared.

          For twenty-four hours, the world wouldn't end.

          But it would definitely feel very different.

          EOF

          echo "Narration script created."

          WORDS=$(wc -w < audio/narration.txt)

          echo "Narration word count: $WORDS"


      # ============================================================
      # 11. GENERATE NARRATION
      # ============================================================

      - name: 🎙️ Generate AI narration
        run: |

          python3 -m piper.download_voices \
            en_US-lessac-medium \
            --data-dir audio/voice

          python3 -m piper \
            --data-dir audio/voice \
            -m en_US-lessac-medium \
            -f audio/narration.wav \
            < audio/narration.txt

          echo "Narration generated."

          ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            audio/narration.wav


      # ============================================================
      # 12. START VIDEO APPLICATION
      # ============================================================

      - name: 🚀 Start video application
        working-directory: artifacts/internet-stopped-24-hours
        run: |

          echo "Starting video application..."

          export PORT=5173
          export BASE_PATH=/

          pnpm dev \
            --host 0.0.0.0 \
            > /tmp/video-app.log 2>&1 &

          echo $! > /tmp/video-app.pid

          sleep 10

          echo "===== VIDEO APP LOG ====="

          cat /tmp/video-app.log

          echo "========================="

          if ! kill -0 \
            $(cat /tmp/video-app.pid) \
            2>/dev/null; then

            echo "Video application failed to start."

            exit 1

          fi


      # ============================================================
      # 13. WAIT FOR APPLICATION
      # ============================================================

      - name: ⏳ Wait for application
        run: |

          for i in {1..60}; do

            if curl -s \
              http://127.0.0.1:5173 \
              > /dev/null; then

              echo "Application is ready!"

              exit 0

            fi

            sleep 2

          done

          echo "Application failed to start."

          cat /tmp/video-app.log

          exit 1


      # ============================================================
      # 14. RECORD VIDEO
      # ============================================================

      - name: 🎥 Record video
        run: |

          cat > render-video.mjs <<'EOF'

          import { chromium } from "playwright";

          const browser = await chromium.launch({
            headless: true
          });

          const context = await browser.newContext({

            viewport: {
              width: 1920,
              height: 1080
            },

            recordVideo: {
              dir: "render",
              size: {
                width: 1920,
                height: 1080
              }
            }

          });

          const page = await context.newPage();

          console.log("Opening video...");

          await page.goto(
            "http://127.0.0.1:5173",
            {
              waitUntil: "networkidle",
              timeout: 120000
            }
          );

          console.log("Video loaded.");

          await page.waitForTimeout(5000);

          console.log("Recording approximately 5 minutes...");

          await page.waitForTimeout(300000);

          console.log("Recording finished.");

          const video = page.video();

          await context.close();

          await browser.close();

          console.log(
            "Recorded:",
            await video.path()
          );

          EOF

          node render-video.mjs


      # ============================================================
      # 15. MEASURE VIDEO DURATION
      # ============================================================

      - name: ⏱️ Measure video duration
        run: |

          WEBM_FILE=$(find render -name "*.webm" | head -1)

          if [ -z "$WEBM_FILE" ]; then
            echo "ERROR: No WebM video found."
            exit 1
          fi

          echo "Video file:"
          echo "$WEBM_FILE"

          VIDEO_DURATION=$(ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            "$WEBM_FILE")

          echo "Video duration:"
          echo "$VIDEO_DURATION seconds"

          VIDEO_DURATION_INT=$(printf "%.0f" "$VIDEO_DURATION")

          echo "Rounded video duration:"
          echo "$VIDEO_DURATION_INT seconds"

          echo "VIDEO_DURATION=$VIDEO_DURATION" >> "$GITHUB_ENV"
          echo "VIDEO_DURATION_INT=$VIDEO_DURATION_INT" >> "$GITHUB_ENV"
          echo "WEBM_FILE=$WEBM_FILE" >> "$GITHUB_ENV"


      # ============================================================
      # 16. CHECK NARRATION DURATION
      # ============================================================

      - name: 🔎 Check narration duration
        run: |

          NARRATION_DURATION=$(ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            audio/narration.wav)

          echo "Narration duration:"
          echo "$NARRATION_DURATION seconds"

          echo "NARRATION_DURATION=$NARRATION_DURATION" >> "$GITHUB_ENV"

          python3 - <<'PY'

          import os

          video = float(os.environ["VIDEO_DURATION"])
          narration = float(os.environ["NARRATION_DURATION"])

          print(f"Video:     {video:.2f} seconds")
          print(f"Narration: {narration:.2f} seconds")

          # Require narration to cover at least 95%
          # of the video.

          required = video * 0.95

          if narration < required:

              print()
              print("ERROR: Narration is too short.")
              print(
                  f"Required at least {required:.2f} seconds."
              )
              print(
                  f"Only {narration:.2f} seconds generated."
              )

              raise SystemExit(1)

          print()
          print("Narration duration check PASSED.")

          PY


      # ============================================================
      # 17. GENERATE BACKGROUND MUSIC FOR EXACT VIDEO LENGTH
      # ============================================================

      - name: 🎵 Generate exact-length background music
        run: |

          python3 - <<'PY'

          import math
          import wave
          import struct
          import os

          sample_rate = 44100

          duration = float(
              os.environ["VIDEO_DURATION"]
          )

          total_samples = int(
              sample_rate * duration
          )

          master_volume = 0.035

          progression = [

              [110.00, 130.81, 164.81],

              [87.31, 110.00, 130.81],

              [130.81, 164.81, 196.00],

              [98.00, 123.47, 146.83]

          ]

          chord_length = 8.0

          output = wave.open(
              "audio/background_music.wav",
              "w"
          )

          output.setnchannels(2)
          output.setsampwidth(2)
          output.setframerate(sample_rate)

          for i in range(total_samples):

              t = i / sample_rate

              chord_index = (
                  int(t / chord_length)
                  % len(progression)
              )

              chord = progression[chord_index]

              local = (
                  (t % chord_length)
                  / chord_length
              )

              fade_in = min(
                  1.0,
                  local * 8.0
              )

              fade_out = min(
                  1.0,
                  (1.0 - local) * 8.0
              )

              envelope = fade_in * fade_out

              sample = 0.0

              for frequency in chord:

                  modulation = (
                      1.0
                      +
                      0.002 *
                      math.sin(
                          2 *
                          math.pi *
                          0.08 *
                          t
                      )
                  )

                  sample += (
                      math.sin(
                          2 *
                          math.pi *
                          frequency *
                          modulation *
                          t
                      )
                      / len(chord)
                  )

              sample += (
                  0.04 *
                  math.sin(
                      2 *
                      math.pi *
                      440 *
                      t
                  )
              )

              sample *= master_volume
              sample *= envelope

              stereo = math.sin(
                  2 *
                  math.pi *
                  0.03 *
                  t
              )

              left = sample * (
                  1 +
                  0.08 * stereo
              )

              right = sample * (
                  1 -
                  0.08 * stereo
              )

              left = max(
                  -1,
                  min(1, left)
              )

              right = max(
                  -1,
                  min(1, right)
              )

              output.writeframes(
                  struct.pack(
                      "<hh",
                      int(left * 32767),
                      int(right * 32767)
                  )
              )

          output.close()

          print(
              f"Music generated for {duration:.2f} seconds."
          )

          PY

          ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            audio/background_music.wav


      # ============================================================
      # 18. GENERATE SFX
      # ============================================================

      - name: 🔊 Generate sound effects
        run: |

          # Notification

          ffmpeg -y \
            -f lavfi \
            -i "sine=frequency=880:duration=0.18" \
            -af "afade=t=out:st=0.08:d=0.10,volume=0.18" \
            audio/sfx/notification.wav


          # Network failure

          ffmpeg -y \
            -f lavfi \
            -i "sine=frequency=700:duration=0.8" \
            -af "afade=t=in:st=0:d=0.05,afade=t=out:st=0.45:d=0.35,volume=0.16" \
            audio/sfx/network_failure.wav


          # Payment beep

          ffmpeg -y \
            -f lavfi \
            -i "sine=frequency=1200:duration=0.12" \
            -af "afade=t=out:st=0.04:d=0.08,volume=0.16" \
            audio/sfx/payment.wav


          # Radio static

          ffmpeg -y \
            -f lavfi \
            -i "anoisesrc=color=pink:duration=1.5:amplitude=0.15" \
            -af "highpass=f=500,lowpass=f=4000,afade=t=in:st=0:d=0.2,afade=t=out:st=1.1:d=0.4,volume=0.30" \
            audio/sfx/radio.wav


          # City ambience

          ffmpeg -y \
            -f lavfi \
            -i "anoisesrc=color=brown:duration=8:amplitude=0.04" \
            -af "lowpass=f=180,volume=0.60" \
            audio/sfx/city.wav


      # ============================================================
      # 19. CREATE FINAL SOUNDTRACK
      # ============================================================

      - name: 🎧 Mix complete soundtrack
        run: |

          echo "Mixing narration + music + SFX..."

          ffmpeg \
            -y \
            -i audio/narration.wav \
            -i audio/background_music.wav \
            -i audio/sfx/notification.wav \
            -i audio/sfx/network_failure.wav \
            -i audio/sfx/payment.wav \
            -i audio/sfx/radio.wav \
            -i audio/sfx/city.wav \
            -filter_complex "

              [0:a]
              loudnorm=I=-16:TP=-1.5:LRA=11,
              volume=1.0
              [voice];

              [1:a]
              volume=0.24
              [music];

              [2:a]
              adelay=5000|5000,
              volume=0.40
              [notification];

              [3:a]
              adelay=38000|38000,
              volume=0.45
              [failure];

              [4:a]
              adelay=65000|65000,
              volume=0.30
              [payment1];

              [4:a]
              adelay=70000|70000,
              volume=0.25
              [payment2];

              [5:a]
              adelay=160000|160000,
              volume=0.22
              [radio];

              [6:a]
              adelay=115000|115000,
              volume=0.15
              [city1];

              [6:a]
              adelay=190000|190000,
              volume=0.12
              [city2];

              [voice]
              [music]
              [notification]
              [failure]
              [payment1]
              [payment2]
              [radio]
              [city1]
              [city2]

              amix=
              inputs=9:
              duration=first:
              dropout_transition=2,

              loudnorm=I=-16:TP=-1.5:LRA=11

              [final]

            " \
            -map "[final]" \
            -c:a pcm_s16le \
            -ar 48000 \
            -ac 2 \
            audio/final-soundtrack.wav


          echo "Final soundtrack created."


      # ============================================================
      # 20. CONVERT VIDEO
      # ============================================================

      - name: 🎬 Convert video to MP4
        run: |

          ffmpeg \
            -y \
            -i "$WEBM_FILE" \
            -c:v libx264 \
            -preset fast \
            -crf 18 \
            -pix_fmt yuv420p \
            -an \
            render/video-only.mp4


      # ============================================================
      # 21. COMBINE VIDEO + AUDIO
      # ============================================================

      - name: 🎬 Create final single MP4
        run: |

          echo "Creating final video..."

          ffmpeg \
            -y \
            -i render/video-only.mp4 \
            -i audio/final-soundtrack.wav \
            -map 0:v:0 \
            -map 1:a:0 \
            -c:v copy \
            -c:a aac \
            -b:a 192k \
            -ar 48000 \
            -ac 2 \
            -t "$VIDEO_DURATION" \
            -movflags +faststart \
            render/24-hours-without-internet.mp4


      # ============================================================
      # 22. VERIFY FINAL VIDEO
      # ============================================================

      - name: ✅ Verify final MP4
        run: |

          echo "=========================================="
          echo "FINAL VIDEO"
          echo "=========================================="

          ffprobe \
            -hide_banner \
            render/24-hours-without-internet.mp4

          echo ""
          echo "=========================================="
          echo "CHECKING VIDEO STREAM"
          echo "=========================================="

          ffprobe \
            -v error \
            -select_streams v:0 \
            -show_entries stream=codec_name,width,height \
            -of default=noprint_wrappers=1 \
            render/24-hours-without-internet.mp4

          echo ""
          echo "=========================================="
          echo "CHECKING AUDIO STREAM"
          echo "=========================================="

          ffprobe \
            -v error \
            -select_streams a:0 \
            -show_entries stream=codec_name,sample_rate,channels \
            -of default=noprint_wrappers=1 \
            render/24-hours-without-internet.mp4

          echo ""
          echo "=========================================="
          echo "FINAL VIDEO DURATION"
          echo "=========================================="

          ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            render/24-hours-without-internet.mp4


      # ============================================================
      # 23. UPLOAD ONLY ONE ARTIFACT
      # ============================================================

      - name: 📤 Upload FINAL VIDEO
        uses: actions/upload-artifact@v4
        with:
          name: 24-hours-without-internet-FINAL
          path: render/24-hours-without-internet.mp4
          retention-days: 7
